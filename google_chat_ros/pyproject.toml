# ROS2 only: python dependencies installed into share/google_chat_ros/venv
# by jsk_ros1_ros2_compat_generate_uv_venv() (ROS1 uses catkin_virtualenv
# with requirements.in*). Update uv.lock with `uv lock`.
[project]
name = "google-chat-ros"
version = "3.0.0"
requires-python = ">=3.10"
# same as requirements.in.python3.12
dependencies = [
    "click<=6.7",
    "gdown==4.7.3",
    "google-api-core[grpc]==2.16.2",
    "google-api-python-client==2.117.0",
    "google-auth-httplib2==0.1.0",
    "google-auth-oauthlib==0.5.2",
    "google-auth==2.25.2",
    "google-cloud-pubsub==2.19.0",
    "googleapis-common-protos[grpc]==1.62.0",
    "grpc-google-iam-v1==0.13.0",
    "grpcio-status==1.59.5",
    "grpcio==1.59.5",
    "httplib2",
    "oauth2client==4.1.3",
    "oauthlib<=3.2.0",
    "protobuf<=5.28.3",
    "requests-oauthlib==2.0.0",
    "requests",
]

[tool.uv]
package = false
