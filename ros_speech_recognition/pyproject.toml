[project]
name = "ros-speech-recognition"
version = "2.1.31"
description = "ROS 2 wrapper for the Python SpeechRecognition library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.198.0",
    "oauth2client>=4.1.3",
    "speechrecognition==3.9.0",
    "vosk==0.3.45",
]

[dependency-groups]
dev = [
    "colcon-common-extensions>=0.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68.1.2"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
