# ROS2 only: python dependencies installed into share/nfc_ros/venv by
# jsk_ros1_ros2_compat_generate_uv_venv() (ROS1 uses catkin_virtualenv
# with requirements.txt, keep the versions in sync). Update uv.lock with
# `uv lock`.
[project]
name = "nfc-ros"
version = "3.0.1"
requires-python = ">=3.10"
dependencies = [
    "nfcpy==1.0.4",
]

[tool.uv]
package = false
