name: ROS 2 Jazzy CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  industrial_ci:
    name: Jazzy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          TARGET_WORKSPACE: >-
            ros_speech_recognition
            3rdparty/voicevox
          UPSTREAM_WORKSPACE: >-
            .github/ros2_jazzy.repos
            -audio_common/audio_common
            -audio_common/audio_play
            -jsk_common_msgs/jsk_common_msgs
            -jsk_common_msgs/jsk_footstep_msgs
            -jsk_common_msgs/jsk_gui_msgs
            -jsk_common_msgs/jsk_hark_msgs
            -jsk_common_msgs/posedetection_msgs
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          AFTER_SETUP_TARGET_WORKSPACE_EMBED: >-
            python3 -m pip install uv &&
            ros_speech_recognition_dir="$current_ws/src/ros_speech_recognition" &&
            (
            cd "$ros_speech_recognition_dir" &&
            uv venv --allow-existing --system-site-packages --python 3.12 &&
            if [ -f pyproject.toml ]; then uv sync --frozen; else uv pip install --python .venv/bin/python3 -r requirements.txt; fi &&
            .venv/bin/python3 -c "import googleapiclient.discovery, speech_recognition, vosk"
            ) &&
            export ROS_SPEECH_RECOGNITION_PYTHON_EXECUTABLE="$ros_speech_recognition_dir/.venv/bin/python3"
